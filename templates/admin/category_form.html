{% extends 'admin/base.html' %}
{% block title %}{{ action }} Category{% endblock %}
{% block content %}
<div class="topbar">
  <h1>{{ action }} Category</h1>
  <a href="{{ url_for('admin_categories') }}" class="btn" style="background:#e2e8f0;color:#333">← Back</a>
</div>

<div class="card" style="max-width:500px">
  <form method="POST">
    <div class="form-group">
      <label>Category Name *</label>
      <input name="name" value="{{ category.name if category else '' }}" required placeholder="e.g. Electronics">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" placeholder="Brief description of this category…">{{ category.description if category else '' }}</textarea>
    </div>
    <div style="display:flex;gap:12px">
      <button type="submit" class="btn btn-primary">💾 {{ action }} Category</button>
      <a href="{{ url_for('admin_categories') }}" class="btn" style="background:#e2e8f0;color:#333">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
