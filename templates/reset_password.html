     SAVE THIS AS: templates/reset_password.html
════════════════════════════════════════════════════════════ -->
{% extends "base.html" %}
{% block title %}Reset Password — kairuAI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-icon">
            <i class="fas fa-key"></i>
        </div>
        <h2>Set New Password</h2>
        <p class="auth-subtitle">Choose a strong password with at least 6 characters.</p>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> New Password</label>
                <div class="input-eye-wrap">
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" required>
                    <button type="button" class="eye-btn" onclick="toggleVis('password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password"><i class="fas fa-lock"></i> Confirm Password</label>
                <div class="input-eye-wrap">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                    <button type="button" class="eye-btn" onclick="toggleVis('confirm_password', this)">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fas fa-check-circle"></i> Reset Password
            </button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('login') }}"><i class="fas fa-arrow-left"></i> Back to Login</a>
        </div>
    </div>
</div>

<style>
.auth-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    background: linear-gradient(135deg, #f0f2ff 0%, #f8f9ff 100%);
}
.auth-card {
    background: white;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 8px 32px rgba(102,126,234,0.15);
    text-align: center;
}
.auth-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}
.auth-icon i { font-size: 28px; color: white; }
.auth-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 800; color: #333; }
.auth-subtitle { color: #777; font-size: 14px; margin: 0 0 28px; line-height: 1.5; }

.auth-form { text-align: left; }
.form-group { margin-bottom: 18px; }
.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #444;
    margin-bottom: 6px;
}
.form-group label i { color: #667eea; margin-right: 5px; }
.form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e9ecef;
    border-radius: 10px;
    font-size: 15px;
    color: #333;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
}
.form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.12); }

.input-eye-wrap { position: relative; }
.input-eye-wrap input { padding-right: 44px; }
.eye-btn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #aaa;
    font-size: 15px;
    padding: 0;
}
.eye-btn:hover { color: #667eea; }

.btn-submit {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 6px;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }

.auth-footer {
    margin-top: 24px;
    font-size: 14px;
}
.auth-footer a { color: #667eea; text-decoration: none; font-weight: 600; }
.auth-footer a:hover { text-decoration: underline; }
</style>

<script>
function toggleVis(id, btn) {
    const inp = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (inp.type === 'password') {
        inp.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        inp.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
{% endblock %}
