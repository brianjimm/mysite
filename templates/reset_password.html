{% extends "base.html" %}
{% block title %}Reset Password — kairuAI{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
    <div style="background:#fff;border-radius:20px;box-shadow:0 8px 32px rgba(102,126,234,0.15);padding:40px;width:100%;max-width:420px">

        <div style="text-align:center;margin-bottom:30px">
            <div style="background:linear-gradient(135deg,#667eea,#764ba2);border-radius:50%;width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                <i class="fas fa-key" style="color:#fff;font-size:26px"></i>
            </div>
            <h2 style="margin:0;font-size:24px;font-weight:800;color:#333">Set New Password</h2>
            <p style="margin:8px 0 0;color:#888;font-size:14px">Choose a strong password for your account</p>
        </div>

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div style="margin-bottom:18px">
                <label style="display:block;font-weight:700;color:#555;margin-bottom:8px;font-size:14px">
                    <i class="fas fa-lock" style="color:#667eea"></i> New Password
                </label>
                <input type="password" name="password" id="pw1" required minlength="6" placeholder="At least 6 characters"
                       style="width:100%;padding:12px 16px;border:2px solid #e9ecef;border-radius:10px;font-size:15px;box-sizing:border-box"
                       onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e9ecef'">
            </div>
            <div style="margin-bottom:24px">
                <label style="display:block;font-weight:700;color:#555;margin-bottom:8px;font-size:14px">
                    <i class="fas fa-lock" style="color:#667eea"></i> Confirm Password
                </label>
                <input type="password" name="confirm_password" id="pw2" required placeholder="Repeat your password"
                       style="width:100%;padding:12px 16px;border:2px solid #e9ecef;border-radius:10px;font-size:15px;box-sizing:border-box"
                       onfocus="this.style.borderColor='#667eea'" onblur="this.style.borderColor='#e9ecef'">
                <p id="match-msg" style="margin:6px 0 0;font-size:12px;color:#aaa"></p>
            </div>

            <button type="submit" id="submit-btn"
                    style="width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:14px;border-radius:25px;font-size:16px;font-weight:700;cursor:pointer">
                <i class="fas fa-check-circle"></i> Reset Password
            </button>
        </form>

        <div style="text-align:center;margin-top:24px">
            <a href="{{ url_for('login') }}" style="color:#667eea;text-decoration:none;font-size:14px;font-weight:600">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<script>
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');
    const msg = document.getElementById('match-msg');
    pw2.addEventListener('input', () => {
        if (pw2.value === '') { msg.textContent = ''; return; }
        if (pw1.value === pw2.value) {
            msg.textContent = '✅ Passwords match';
            msg.style.color = '#28a745';
        } else {
            msg.textContent = '❌ Passwords do not match';
            msg.style.color = '#dc3545';
        }
    });
</script>
{% endblock %}
