{% extends "base.html" %}
{% block title %}Order via Chat — kairuAI{% endblock %}

{% block extra_styles %}
<style>
    .b2b-wrap {
        max-width: 560px;
        margin: 20px auto;
        padding: 0 14px;
    }
    .b2b-header {
        text-align: center;
        margin-bottom: 14px;
    }
    .b2b-header h1 {
        font-size: 22px;
        color: #333;
        margin: 0 0 4px;
    }
    .b2b-header p {
        color: #777;
        font-size: 14px;
        margin: 0;
    }
    .b2b-chat-box {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        display: flex;
        flex-direction: column;
        height: 70vh;
        min-height: 420px;
        overflow: hidden;
    }
    .b2b-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: #f8f9fc;
    }
    .b2b-msg {
        max-width: 82%;
        padding: 10px 14px;
        border-radius: 16px;
        font-size: 14.5px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
    }
    .b2b-msg.bot {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #eee;
        color: #333;
        border-bottom-left-radius: 4px;
    }
    .b2b-msg.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border-bottom-right-radius: 4px;
    }
    .b2b-msg.typing {
        align-self: flex-start;
        background: #fff;
        border: 1px solid #eee;
        color: #999;
        font-style: italic;
    }
    .b2b-quick-replies {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 16px 10px;
        background: #f8f9fc;
    }
    .b2b-quick-replies button {
        background: #fff;
        border: 1px solid #667eea;
        color: #667eea;
        border-radius: 16px;
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
    }
    .b2b-quick-replies button:active { background: #667eea; color: #fff; }
    .b2b-input-row {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #eee;
        background: #fff;
    }
    .b2b-input-row input {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 22px;
        padding: 10px 16px;
        font-size: 14.5px;
        outline: none;
    }
    .b2b-input-row input:focus { border-color: #667eea; }
    .b2b-input-row button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border: none;
        border-radius: 50%;
        width: 42px;
        height: 42px;
        flex-shrink: 0;
        cursor: pointer;
        font-size: 16px;
    }
    .b2b-input-row button:disabled { opacity: 0.6; }
</style>
{% endblock %}

{% block content %}
<div class="b2b-wrap">
    <div class="b2b-header">
        <h1>🛒 Order with KairuAI</h1>
        <p>Tell us what you need — we'll quote the price straight from our platform.</p>
    </div>

    <div class="b2b-chat-box">
        <div class="b2b-messages" id="b2bMessages"></div>
        <div class="b2b-quick-replies" id="b2bQuickReplies"></div>
        <form class="b2b-input-row" id="b2bForm">
            <input type="text" id="b2bInput" placeholder="Type what you need…" autocomplete="off" required>
            <button type="submit" id="b2bSend"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(function () {
    const messagesEl = document.getElementById('b2bMessages');
    const quickRepliesEl = document.getElementById('b2bQuickReplies');
    const form = document.getElementById('b2bForm');
    const input = document.getElementById('b2bInput');
    const sendBtn = document.getElementById('b2bSend');

    const TOKEN_KEY = 'kairu_b2b_session_token';
    let sessionToken = localStorage.getItem(TOKEN_KEY) || '';

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'b2b-msg ' + role;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'b2b-msg typing';
        div.id = 'b2bTyping';
        div.textContent = 'Typing…';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('b2bTyping');
        if (el) el.remove();
    }

    function setQuickReplies(list) {
        quickRepliesEl.innerHTML = '';
        (list || []).forEach(function (label) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = label;
            btn.onclick = function () { sendMessage(label); };
            quickRepliesEl.appendChild(btn);
        });
    }

    function quickRepliesForState(state) {
        if (state === 'AWAIT_QUANTITY') return ['1', '5', '10', '20'];
        if (state === 'AWAIT_CONTACT_ORDER' || state === 'AWAIT_CONTACT_ESCALATION') return [];
        return ['Cement', 'Phone charger', 'Cooking oil', 'Track my order'];
    }

    async function sendMessage(text) {
        if (!text) return;
        addMessage('user', text);
        setQuickReplies([]);
        input.value = '';
        sendBtn.disabled = true;
        showTyping();
        try {
            const res = await fetch('/api/b2b-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: sessionToken, message: text })
            });
            const data = await res.json();
            hideTyping();
            if (data.session_token) {
                sessionToken = data.session_token;
                localStorage.setItem(TOKEN_KEY, sessionToken);
            }
            if (data.reply) addMessage('bot', data.reply);
            setQuickReplies(quickRepliesForState(data.state));
        } catch (err) {
            hideTyping();
            addMessage('bot', "Sorry, I couldn't reach the server. Please check your connection and try again.");
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        sendMessage(input.value.trim());
    });

    // Kick off the conversation on page load
    async function startConversation() {
        showTyping();
        try {
            const res = await fetch('/api/b2b-chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: sessionToken, message: '' })
            });
            const data = await res.json();
            hideTyping();
            if (data.session_token) {
                sessionToken = data.session_token;
                localStorage.setItem(TOKEN_KEY, sessionToken);
            }
            if (data.reply) addMessage('bot', data.reply);
            setQuickReplies(quickRepliesForState(data.state));
        } catch (err) {
            hideTyping();
            addMessage('bot', '👋 Welcome to KairuAI! What do you need today so that we can supply to you?');
        }
    }

    startConversation();
})();
</script>
{% endblock %}
