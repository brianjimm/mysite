
<!-- templates/500.html -->
{% extends "base.html" %}

{% block title %}Server Error - tradioAI{% endblock %}

{% block content %}
<div class="container">
    <div class="error-page">
        <div class="error-content">
            <h1>500</h1>

            <a href="{{ url_for('home') }}" class="btn btn-primary">Go Home</a>
        </div>
    </div>
</div>
{% endblock %}
